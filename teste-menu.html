<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            background-color: #6b6b6b;
        }

        html,
        body {
            height: 100vh;
        }

        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 1,
                'wght' 400,
                'GRAD' 0,
                'opsz' 50;
            font-size: 2rem;
            color: rgb(206, 152, 35);
            background-color: #272727;
        }

        .bottom_menu {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            padding: 5px 0;
            background-color: #272727;

            display: flex;
            gap: 5px;
            justify-content: space-around;
            align-items: center;
            z-index: 10000;
        }

        .bottom_menu::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(to top, #272727, #27272780, rgba(255, 255, 255, 0));
            bottom: 100%;
            z-index: 100;
            background-repeat: no-repeat;
        }

        .item_menu {
            background-color: #272727;
            cursor: pointer;
            transition: 0.3s;

            &:hover {
                scale: 1.1;

            }

            &:active {
                scale: 1.2;
            }
        }

        section {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            padding: 10px 0 70px;
        }

        .box_card {
            width: 150px;
            height: 200px;
            background-image: radial-gradient(circle, rgb(255, 166, 0), rgb(175, 114, 0));
            border-radius: 1rem;
        }
    </style>

</head>

<body>
    <main>
        <section>
            <div class="box_card"></div>
            <div class="box_card"></div>
            <div class="box_card"></div>
            <div class="box_card"></div>
            <div class="box_card"></div>
            <div class="box_card"></div>
            <div class="box_card"></div>
            <div class="box_card"></div>
        </section>
    </main>
    <div class="bottom_menu">
        <div class="item_menu">
            <span class="material-symbols-outlined">
                home
            </span>
        </div>
        <div class="item_menu">
            <span class="material-symbols-outlined">
                add_circle
            </span>
        </div>
        <div class="item_menu">
            <span class="material-symbols-outlined">
                sort
            </span>
        </div>
        <div class="item_menu">
            <span class="material-symbols-outlined">
                settings
            </span>
        </div>
    </div>
</body>

</html>
